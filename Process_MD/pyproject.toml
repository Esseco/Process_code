[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "process-md"
version = "0.1.0"
description = "Modular building blocks for MLIP molecular dynamics and analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "ase>=3.25,<4"]

[project.optional-dependencies]
chgnet = ["chgnet>=0.4,<0.5"]
mace = ["mace-torch>=0.3.14,<0.4"]
analysis = ["pymatgen-analysis-diffusion>=2024.7.15"]
uncertainty = ["kinisi>=2.1,<3"]
jumps = ["gemdat>=1.8.1,<2"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["process_md*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
